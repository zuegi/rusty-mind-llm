<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#fff7ed" />
    </linearGradient>
    <radialGradient id="rust-glow" cx="82%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#fdba74" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emerald-glow" cx="72%" cy="85%" r="42%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#6ee7b7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.12" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Base background & subtle grid -->
  <rect width="1280" height="720" fill="url(#bg-grad)" />
  <rect width="1280" height="720" fill="url(#grid)" />
  <rect width="1280" height="720" fill="url(#rust-glow)" />
  <rect width="1280" height="720" fill="url(#emerald-glow)" />

  <!-- Stylized Transformer / Neural network constellation on the right -->
  <g stroke-linecap="round" opacity="0.85">
    <!-- Attention / layer edges -->
    <g stroke="#ea580c" stroke-opacity="0.20" stroke-width="1.4">
      <line x1="780" y1="540" x2="860" y2="410" />
      <line x1="780" y1="540" x2="960" y2="410" />
      <line x1="780" y1="540" x2="1060" y2="410" />
      <line x1="900" y1="540" x2="860" y2="410" />
      <line x1="900" y1="540" x2="960" y2="410" />
      <line x1="900" y1="540" x2="1060" y2="410" />
      <line x1="900" y1="540" x2="1160" y2="410" />
      <line x1="1020" y1="540" x2="960" y2="410" />
      <line x1="1020" y1="540" x2="1060" y2="410" />
      <line x1="1020" y1="540" x2="1160" y2="410" />
      <line x1="1140" y1="540" x2="1060" y2="410" />
      <line x1="1140" y1="540" x2="1160" y2="410" />
    </g>

    <g stroke="#0284c7" stroke-opacity="0.22" stroke-width="1.4">
      <line x1="860" y1="410" x2="830" y2="275" />
      <line x1="860" y1="410" x2="950" y2="275" />
      <line x1="960" y1="410" x2="830" y2="275" />
      <line x1="960" y1="410" x2="950" y2="275" />
      <line x1="960" y1="410" x2="1070" y2="275" />
      <line x1="1060" y1="410" x2="950" y2="275" />
      <line x1="1060" y1="410" x2="1070" y2="275" />
      <line x1="1060" y1="410" x2="1180" y2="275" />
      <line x1="1160" y1="410" x2="1070" y2="275" />
      <line x1="1160" y1="410" x2="1180" y2="275" />
    </g>

    <g stroke="#059669" stroke-opacity="0.25" stroke-width="1.6">
      <line x1="830" y1="275" x2="990" y2="145" />
      <line x1="950" y1="275" x2="990" y2="145" />
      <line x1="1070" y1="275" x2="990" y2="145" />
      <line x1="1180" y1="275" x2="990" y2="145" />
    </g>

    <!-- Highlighted active path -->
    <g stroke="#ea580c" stroke-opacity="0.82" stroke-width="2.4">
      <line x1="900" y1="540" x2="960" y2="410" />
      <line x1="960" y1="410" x2="1070" y2="275" />
      <line x1="1070" y1="275" x2="990" y2="145" />
    </g>

    <!-- Layer 1: Input token nodes -->
    <g fill="#ffffff" stroke="#64748b" stroke-width="2">
      <circle cx="780" cy="540" r="8" />
      <circle cx="900" cy="540" r="9" fill="#ea580c" stroke="#fed7aa" />
      <circle cx="1020" cy="540" r="8" />
      <circle cx="1140" cy="540" r="8" />
    </g>

    <!-- Layer 2: Attention nodes -->
    <g fill="#ffffff" stroke="#ea580c" stroke-width="2">
      <circle cx="860" cy="410" r="8" />
      <circle cx="960" cy="410" r="10" fill="#ea580c" stroke="#fed7aa" />
      <circle cx="1060" cy="410" r="8" />
      <circle cx="1160" cy="410" r="8" />
    </g>

    <!-- Layer 3: Feed-Forward nodes -->
    <g fill="#ffffff" stroke="#0284c7" stroke-width="2">
      <circle cx="830" cy="275" r="8" />
      <circle cx="950" cy="275" r="8" />
      <circle cx="1070" cy="275" r="10" fill="#0284c7" stroke="#bae6fd" />
      <circle cx="1180" cy="275" r="8" />
    </g>

    <!-- Output next-token node -->
    <circle cx="990" cy="145" r="22" fill="#10b981" fill-opacity="0.16" />
    <circle cx="990" cy="145" r="11" fill="#059669" stroke="#a7f3d0" stroke-width="2" />

    <!-- Subtle floating token chips (purely decorative) -->
    <g font-family="monospace" font-size="13" fill="#475569">
      <rect x="742" y="564" width="76" height="24" rx="5" fill="#ffffff" fill-opacity="0.9" stroke="#cbd5e1" />
      <text x="780" y="580" text-anchor="middle">Der</text>

      <rect x="862" y="564" width="76" height="24" rx="5" fill="#fff7ed" fill-opacity="0.95" stroke="#fb923c" />
      <text x="900" y="580" text-anchor="middle" fill="#c2410c" font-weight="600">Hund</text>

      <rect x="982" y="564" width="76" height="24" rx="5" fill="#ffffff" fill-opacity="0.9" stroke="#cbd5e1" />
      <text x="1020" y="580" text-anchor="middle">...</text>

      <rect x="944" y="92" width="92" height="26" rx="6" fill="#ecfdf5" fill-opacity="0.95" stroke="#10b981" />
      <text x="990" y="109" text-anchor="middle" fill="#047857" font-weight="600">→ rennt</text>
    </g>
  </g>
</svg>
