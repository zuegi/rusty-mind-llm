[package]
name = "training"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
burn = { version = "0.22.0", default-features = false, features = ["std", "optim"] }
model = { path = "../model" }
tiktoken-rs = "0.12.1"
rand = "0.10.3"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
burn = { version = "0.22.0", default-features = false, features = ["std", "flex", "autodiff"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
